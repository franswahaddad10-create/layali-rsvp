services:
  - type: web
    name: layali-rsvp-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: APP_URL
        sync: false
      - key: ENABLE_SEED_ADMIN
        value: "false"
      - key: PASSWORD_MIN_LENGTH
        value: "10"
      - key: AUTH_RATE_LIMIT_MAX
        value: "10"
      - key: PUBLIC_RSVP_RATE_LIMIT_MAX
        value: "30"
      - key: WEBHOOK_RATE_LIMIT_MAX
        value: "120"
      - key: LOGIN_MAX_FAILED_ATTEMPTS
        value: "5"
      - key: LOGIN_LOCK_MINUTES
        value: "15"
      - key: WHATSAPP_PROVIDER
        value: manual
